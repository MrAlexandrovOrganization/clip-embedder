[project]
name = "clip-embedder"
version = "0.1.0"
description = "gRPC microservice that embeds images and text with open_clip (CLIP)."
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "grpcio-health-checking",
    "open_clip_torch",
    "pillow",
    "numpy",
]

[project.optional-dependencies]
cpu = ["torch==2.8.0", "torchvision==0.23.0"]
cuda = ["torch==2.8.0", "torchvision==0.23.0"]

[dependency-groups]
dev = [
    "ruff==0.16.5",
    "pytest",
    "pre-commit",
]

# Application, not a library: don't build/install ourselves into the venv.
[tool.uv]
package = false
conflicts = [[{extra = "cpu"}, {extra = "cuda"}]]

[tool.uv.sources]
torch = [
 {index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'"},
 {index = "pytorch-cuda", extra = "cuda", marker = "sys_platform == 'linux'"},
]
torchvision = [
 {index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'"},
 {index = "pytorch-cuda", extra = "cuda", marker = "sys_platform == 'linux'"},
]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated gRPC stubs live in src/ and must not be linted.
extend-exclude = ["src/embed_pb2.py", "src/embed_pb2_grpc.py", "src/embed_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I"]
