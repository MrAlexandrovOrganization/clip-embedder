syntax = "proto3";
package embed;

option go_package = "stash/gen/embed";

// EmbedderService produces vector embeddings for images and text using a single
// shared multimodal space (CLIP/open_clip). The stash backend calls this
// service over gRPC; the reference implementation lives in this repository.
//
// Canonical schema for the shared contract. The stash backend mirrors it at
// proto/embed/embed.proto — keep the two in sync (only comments may differ).
//
// Generate Python stubs with:    make proto
service EmbedderService {
  rpc EmbedImage(EmbedImageRequest) returns (EmbedResponse);
  rpc EmbedText(EmbedTextRequest) returns (EmbedResponse);
}

message EmbedImageRequest {
  bytes image = 1;
}

message EmbedTextRequest {
  string text = 1;
}

message EmbedResponse {
  repeated float vector = 1;
  int32 dim = 2;
  string model = 3;
  string pretrained = 4;
}

// Worker-only RPCs. Expose this service through Caddy, never EmbedderService.
service WorkerService {
  rpc Report(ReportRequest) returns (WorkerReply);
  rpc Claim(ClaimRequest) returns (ClaimResponse);
  rpc Heartbeat(LeaseRequest) returns (WorkerReply);
  rpc Complete(CompleteRequest) returns (WorkerReply);
  rpc Fail(FailRequest) returns (WorkerReply);
}
message ReportRequest {
  string worker_id = 1;
  string instance_id = 2;
  bool ready = 3;
  string model = 4;
  string pretrained = 5;
}
message WorkerReply { bool accepted = 1; }
message ClaimRequest { string worker_id = 1; string instance_id = 2; }
message LeaseRequest {
  string worker_id = 1;
  string instance_id = 2;
  string job_id = 3;
  string lease_id = 4;
}
message ClaimResponse {
  string job_id = 1;
  string lease_id = 2;
  bytes image = 3;
  string text = 4;
  string kind = 5;
  string model = 6;
  string pretrained = 7;
}
message CompleteRequest { LeaseRequest lease = 1; EmbedResponse result = 2; }
message FailRequest { LeaseRequest lease = 1; bool permanent = 2; }
