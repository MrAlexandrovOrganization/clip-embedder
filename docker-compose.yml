services:
  clip-embedder:
    build:
      context: .
      dockerfile: src/Dockerfile
    restart: unless-stopped
    extends:
      file: docker-compose.base.yml
      service: base
    environment:
      CLIP_MODEL: "${CLIP_MODEL:-ViT-B/32}"
      CLIP_PRETRAIN: "${CLIP_PRETRAIN:-laion2b_s34b_b79k}"
      GRPC_PORT: "50051"
    ports:
      - "127.0.0.1:50051:50051"
    networks:
      - clip-net
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"

# Shared with the stash backend so it can reach clip-embedder:50051.
networks:
  clip-net:
    name: clip-net
